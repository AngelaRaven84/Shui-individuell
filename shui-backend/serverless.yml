service: shui-api
useDotenv: true

provider:
  name: aws
  runtime: nodejs22.x
  region: eu-north-1
  stage: dev
  environment:
    TABLE_NAME:
      Ref: ShuiTable
    JWT_SECRET: ${env:JWT_SECRET}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - Fn::GetAtt: [ShuiTable, Arn]
        - Effect: Allow
          Action:
            - dynamodb:Query
          Resource:
            - Fn::GetAtt: [ShuiTable, Arn]
            - Fn::Sub: '${ShuiTable.Arn}/index/GSI1'

functions:
  getMessages:
    handler: functions/getMessages/index.handler
    events:
      - httpApi:
          path: /messages
          method: GET

  getMessage:
    handler: functions/getMessage/index.handler
    events:
      - httpApi:
          path: /users/{userId}/messages/{id}
          method: GET

  getUserMessages:
    handler: functions/getUserMessages/index.handler
    events:
      - httpApi:
          path: /users/{username}/messages
          method: GET

  register:
    handler: functions/register/index.handler
    events:
      - httpApi:
          path: /auth/register
          method: POST

  login:
    handler: functions/login/index.handler
    events:
      - httpApi:
          path: /auth/login
          method: POST

  createMessage:
    handler: functions/createMessage/index.handler
    events:
      - httpApi:
          path: /messages
          method: POST

  updateMessage:
    handler: functions/updateMessage/index.handler
    events:
      - httpApi:
          path: /users/{userId}/messages/{id}
          method: PATCH

  deleteMessage:
    handler: functions/deleteMessage/index.handler
    events:
      - httpApi:
          path: /users/{userId}/messages/{id}
          method: DELETE

resources:
  Resources:
    ShuiTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: shui-${sls:stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
          - AttributeName: GSI1PK
            AttributeType: S
          - AttributeName: GSI1SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: GSI1
            KeySchema:
              - AttributeName: GSI1PK
                KeyType: HASH
              - AttributeName: GSI1SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
