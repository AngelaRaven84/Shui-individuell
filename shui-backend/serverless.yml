service: shui-api

provider:
  name: aws
  runtime: nodejs22.x
  region: eu-north-1
  stage: dev
  environment:
    TABLE_NAME:
      Ref: ShuiTable

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - Fn::GetAtt: [ShuiTable, Arn]
        - Effect: Allow
          Action:
            - dynamodb:Query
          Resource:
            - Fn::GetAtt: [ShuiTable, Arn]
            - Fn::Sub: '${ShuiTable.Arn}/index/GSI1'

functions:

  getMessages:
    handler: functions/getMessages/index.handler
    events:
      - httpApi:
          path: /messages
          method: GET

resources:
  Resources:
    ShuiTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: shui-${sls:stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
          - AttributeName: GSI1PK
            AttributeType: S
          - AttributeName: GSI1SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: GSI1
            KeySchema:
              - AttributeName: GSI1PK
                KeyType: HASH
              - AttributeName: GSI1SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
